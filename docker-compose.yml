# Local run: SQL Server + API.
# Secrets come from a .env file next to this file (copy .env.example to .env). .env is git-ignored.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/AttendanceApi.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AttendanceDb: "Server=sqlserver,1433;Database=AttendanceApi;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      SeedAdmin__UserName: ${SEED_ADMIN_USERNAME:?set SEED_ADMIN_USERNAME in .env}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      # Demo data is on in Development; set DEMO_USER_PASSWORD to also create demo clerk/viewer accounts.
      DemoData__UserPassword: ${DEMO_USER_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - apilogs:/app/logs

volumes:
  sqldata:
  apilogs:
